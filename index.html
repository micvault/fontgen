<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝙋𝙀𝙍𝙈𝙎 Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      font-size: 18px;
      box-sizing: border-box;
      resize: vertical;
    }

    #output {
      margin-top: 20px;
      padding: 20px;
      min-height: 40px;
      background: #222;
      font-size: 32px;
      word-wrap: break-word;
    }

    button {
      margin-top: 15px;
      padding: 10px 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>𝙋𝙀𝙍𝙈𝙎 Generator</h1>

  <textarea id="input" placeholder="Type something..."></textarea>

  <div id="output"></div>

  <button onclick="copyText()">Copy</button>

  <script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");

    function convertText(text) {
      return [...text].map(char => {
        const code = char.codePointAt(0);

        // Uppercase letters
        if (code >= 65 && code <= 90) {
          return String.fromCodePoint(0x1D63C + (code - 65));
        }

        // Lowercase letters
        if (code >= 97 && code <= 122) {
          return String.fromCodePoint(0x1D656 + (code - 97));
        }

        // Numbers
        if (code >= 48 && code <= 57) {
          return String.fromCodePoint(0x1D7EC + (code - 48));
        }

        // Keep spaces and symbols unchanged
        return char;
      }).join("");
    }

    input.addEventListener("input", () => {
      output.textContent = convertText(input.value);
    });

    function copyText() {
      navigator.clipboard.writeText(output.textContent);
      alert("Copied!");
    }
  </script>
</body>
</html>
