<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font Generator</title>

  <style>
    :root {
      --bg: #101114;
      --panel: #191b21;
      --panel-light: #232630;
      --text: #f5f7fb;
      --muted: #9da3b2;
      --accent: #8b5cf6;
      --accent-light: #a78bfa;
      --border: #303441;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 38px;
    }

    header p {
      color: var(--muted);
      margin: 0;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      resize: vertical;
      background: var(--panel);
      color: white;
      font-size: 20px;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      flex-wrap: wrap;
    }

    .counter {
      color: var(--muted);
      font-size: 14px;
      margin-right: auto;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: var(--accent-light);
    }

    .styles {
      display: grid;
      gap: 14px;
    }

    .style-card {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .style-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .style-name {
      color: var(--accent-light);
      font-size: 14px;
      font-weight: bold;
    }

    .result {
      min-height: 42px;
      padding: 12px;
      border-radius: 9px;
      background: var(--panel-light);
      font-size: 27px;
      overflow-wrap: anywhere;
      line-height: 1.4;
    }

    .empty {
      color: var(--muted);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .result {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>Font Generator</h1>
      <p>Type something below and choose your favorite style.</p>
    </header>

    <textarea id="input" placeholder="Type your text here...">PERMS</textarea>

    <div class="toolbar">
      <span class="counter" id="counter">5 characters</span>
      <button onclick="insertSymbol()">Insert 一</button>
      <button onclick="copyAll()">Copy All</button>
    </div>

    <section class="styles" id="styles"></section>
  </main>

  <script>
    const input = document.getElementById("input");
    const stylesContainer = document.getElementById("styles");
    const counter = document.getElementById("counter");

    const styles = [
      {
        name: "Sans Serif Bold Italic",
        convert: text => convertUnicode(text, 0x1D63C, 0x1D656, 0x1D7EC)
      },
      {
        name: "Bold",
        convert: text => convertUnicode(text, 0x1D400, 0x1D41A, 0x1D7CE)
      },
      {
        name: "Italic",
        convert: text => convertUnicode(text, 0x1D434, 0x1D44E, null)
      },
      {
        name: "Bold Italic",
        convert: text => convertUnicode(text, 0x1D468, 0x1D482, null)
      },
      {
        name: "Sans Serif",
        convert: text => convertUnicode(text, 0x1D5A0, 0x1D5BA, null)
      },
      {
        name: "Sans Serif Italic",
        convert: text => convertUnicode(text, 0x1D608, 0x1D622, null)
      },
      {
        name: "Sans Serif Bold",
        convert: text => convertUnicode(text, 0x1D5D4, 0x1D5EE, 0x1D7EC)
      },
      {
        name: "Monospace",
        convert: text => convertUnicode(text, 0x1D670, 0x1D68A, 0x1D7F6)
      },
      {
        name: "Circled",
        convert: text => convertCircled(text)
      },
      {
        name: "Small Caps",
        convert: text => convertSmallCaps(text)
      }
    ];

    function convertUnicode(text, upperStart, lowerStart, digitStart) {
      return [...text].map(char => {
        const code = char.codePointAt(0);

        if (code >= 65 && code <= 90) {
          return String.fromCodePoint(upperStart + code - 65);
        }

        if (code >= 97 && code <= 122) {
          return String.fromCodePoint(lowerStart + code - 97);
        }

        if (digitStart && code >= 48 && code <= 57) {
          return String.fromCodePoint(digitStart + code - 48);
        }

        return char;
      }).join("");
    }

    function convertCircled(text) {
      return [...text].map(char => {
        const code = char.toUpperCase().charCodeAt(0);

        if (code >= 65 && code <= 90) {
          return String.fromCodePoint(0x24B6 + code - 65);
        }

        if (code >= 49 && code <= 57) {
          return String.fromCodePoint(0x2460 + code - 49);
        }

        if (char === "0") {
          return "⓪";
        }

        return char;
      }).join("");
    }

    function convertSmallCaps(text) {
      const smallCaps = {
        a: "ᴀ", b: "ʙ", c: "ᴄ", d: "ᴅ", e: "ᴇ",
        f: "ꜰ", g: "ɢ", h: "ʜ", i: "ɪ", j: "ᴊ",
        k: "ᴋ", l: "ʟ", m: "ᴍ", n: "ɴ", o: "ᴏ",
        p: "ᴘ", q: "ǫ", r: "ʀ", s: "ꜱ", t: "ᴛ",
        u: "ᴜ", v: "ᴠ", w: "ᴡ", x: "ˣ", y: "ʏ", z: "ᴢ"
      };

      return [...text].map(char => {
        return smallCaps[char.toLowerCase()] || char;
      }).join("");
    }

    function insertSymbol() {
      const symbol = "一";
      const start = input.selectionStart;
      const end = input.selectionEnd;

      input.value =
        input.value.slice(0, start) +
        symbol +
        input.value.slice(end);

      input.focus();

      const newPosition = start + symbol.length;
      input.setSelectionRange(newPosition, newPosition);

      render();
    }

    function render() {
      const text = input.value;

      counter.textContent =
        `${text.length} character${text.length === 1 ? "" : "s"}`;

      stylesContainer.innerHTML = styles.map((style, index) => {
        const result = text
          ? style.convert(text)
          : '<span class="empty">Your converted text will appear here...</span>';

        return `
          <article class="style-card">
            <div class="style-header">
              <span class="style-name">${style.name}</span>
              <button onclick="copyStyle(${index})">Copy</button>
            </div>

            <div class="result" id="result-${index}">
              ${result}
            </div>
          </article>
        `;
      }).join("");
    }

    function copyStyle(index) {
      navigator.clipboard.writeText(styles[index].convert(input.value));
    }

    function copyAll() {
      const text = styles
        .map(style => `${style.name}: ${style.convert(input.value)}`)
        .join("\n");

      navigator.clipboard.writeText(text);
    }

    input.addEventListener("input", render);

    render();
  </script>
</body>
</html>
